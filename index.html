<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ERIC.LOG</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0c0c0d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ERIC.LOG">
  <link rel="apple-touch-icon" href="icon.svg">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Noto Sans TC"', 'sans-serif'],
            mono: ['SF Pro Text', 'ui-monospace', 'Menlo', 'monospace']
          },
          colors: {
            neutral: {
              950: '#0c0c0d',
              900: '#141416',
              850: '#1a1a1d',
              800: '#222226',
              700: '#323238',
              650: '#484852',
              400: '#8e8e98',
              300: '#b4b4bd',
              200: '#dedee3'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      padding-top: max(1.5rem, env(safe-area-inset-top));
      padding-bottom: max(2rem, env(safe-area-inset-bottom));
      padding-left: max(1rem, env(safe-area-inset-left));
      padding-right: max(1rem, env(safe-area-inset-right));
      -webkit-touch-callout: none;
    }
    textarea:focus, input:focus { outline: none; }
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #2a2a30; border-radius: 2px; }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-200 min-h-screen font-sans antialiased flex justify-center selection:bg-neutral-800">

  <div class="w-full max-w-4xl flex flex-col gap-6 md:gap-8">
    
    <!-- Top Bar -->
    <header class="border-b border-neutral-800 pb-5 flex flex-wrap justify-between items-baseline gap-4">
      <div>
        <div class="text-[11px] font-mono tracking-[0.25em] text-neutral-400 uppercase">Dual Dimension Journal</div>
        <h1 class="text-2xl font-light tracking-wide text-neutral-100 mt-1 font-mono">ERIC.LOG</h1>
      </div>
      <div class="flex items-center gap-4 md:gap-6">
        <div class="text-xs font-mono text-neutral-400" id="currentDateDisplay">----.--.--</div>
        <div class="text-xs font-mono px-2.5 py-1 bg-neutral-900 border border-neutral-800 rounded">
          <span id="tabBadge" class="text-neutral-400 mr-1.5 font-mono">WORK</span>
          <span id="progressPercent" class="text-neutral-100 font-semibold">0%</span>
        </div>
      </div>
    </header>

    <!-- Tab Switcher -->
    <div class="flex border-b border-neutral-800 text-xs font-mono">
      <button 
        id="btnTabWork" 
        class="pb-3 px-4 border-b-2 border-neutral-200 text-neutral-100 transition-colors flex items-center gap-2"
      >
        <span>01</span>
        <span>WORK.LOG (工作觀察誌)</span>
      </button>
      <button 
        id="btnTabLife" 
        class="pb-3 px-4 border-b-2 border-transparent text-neutral-500 hover:text-neutral-300 transition-colors flex items-center gap-2"
      >
        <span>02</span>
        <span>LIFE.LOG (生活流動誌)</span>
      </button>
    </div>

    <!-- Main Content Area -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      
      <!-- Left Column: Checkpoints -->
      <section class="lg:col-span-7 flex flex-col gap-4">
        <div class="flex items-center justify-between text-xs font-mono text-neutral-400 tracking-wider uppercase mb-1">
          <span id="sectionTitle">Checkpoints</span>
          <span id="checkedCount">0 / 10 COMPLETED</span>
        </div>

        <div id="checkpointsContainer" class="flex flex-col gap-2.5">
          <!-- Dynamic Core Items -->
        </div>
      </section>

      <!-- Right Column: Quick Notes / Tasks & Actions -->
      <section class="lg:col-span-5 flex flex-col gap-6">
        
        <div class="bg-neutral-900 border border-neutral-800 rounded-lg p-5 flex flex-col gap-4">
          <div class="flex items-center justify-between">
            <span class="text-xs font-mono text-neutral-400 tracking-wider uppercase" id="taskBoxTitle">臨時任務 / 生活備忘</span>
            <span class="text-[11px] font-mono text-neutral-500" id="activeTaskCount">0 待辦</span>
          </div>

          <div class="flex gap-2">
            <input 
              type="text" 
              id="newTaskInput" 
              placeholder="輸入臨時交辦、即時念頭..." 
              class="w-full bg-neutral-950 border border-neutral-800 rounded px-3 py-2 text-xs text-neutral-200 placeholder-neutral-600 focus:border-neutral-500 transition-colors"
            />
            <button 
              id="addTaskBtn" 
              class="px-3.5 py-2 bg-neutral-800 hover:bg-neutral-700 active:bg-neutral-600 text-neutral-200 text-xs font-mono rounded transition-colors whitespace-nowrap"
            >
              + 新增
            </button>
          </div>

          <div id="taskList" class="flex flex-col gap-2 max-h-[340px] overflow-y-auto custom-scroll pr-1">
            <div id="emptyTaskPlaceholder" class="text-xs text-neutral-600 italic py-4 text-center">
              尚無速記備忘
            </div>
          </div>
        </div>

        <div class="flex flex-col gap-2">
          <button 
            id="copyMarkdownBtn" 
            class="w-full py-2.5 bg-neutral-900 hover:bg-neutral-850 active:bg-neutral-800 border border-neutral-700 text-xs font-mono tracking-wider text-neutral-200 rounded transition-all flex items-center justify-center gap-2"
          >
            <span>複製全日紀錄 (MARKDOWN)</span>
          </button>
          <button 
            id="resetDayBtn" 
            class="w-full py-2 text-[11px] font-mono text-neutral-500 hover:text-red-400 transition-colors text-center"
          >
            清空當前分頁紀錄
          </button>
        </div>

      </section>

    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }

    // 工作觀察 10 項
    const WORK_ITEMS = [
      { id: 'w_start', label: '今天開始前的我', placeholder: '早晨的身心狀態、出門時的微小念頭...' },
      { id: 'w_loc', label: '今天在哪裡', placeholder: '辦公室、基地現場、某個咖啡角、高鐵途中...' },
      { id: 'w_doing', label: '今天在做什麼', placeholder: '今日的核心事件或推動的企劃焦點...' },
      { id: 'w_details', label: '3 個工作細節', placeholder: '1. \n2. \n3. ' },
      { id: 'w_scene', label: '一個「我本人在工作」的畫面', placeholder: '如第三人視角抽離看到的定格光景...' },
      { id: 'w_sound', label: '一個環境聲', placeholder: '鍵盤敲擊、空調低頻、某段對話殘響、雨聲...' },
      { id: 'w_reaction', label: '事情結束後的第一反應', placeholder: '收拾電腦闔上螢幕那一刻真實浮現的情緒...' },
      { id: 'w_quote', label: '今天有沒有一句值得留下的話', placeholder: '會議上的字句、聽到的話、或心裡的旁白...' },
      { id: 'w_countdown', label: '今天有沒有「離職倒數」的感覺', placeholder: '敏銳觀察邊界感、抽離感或純粹專注...' },
      { id: 'w_night', label: '晚上要不要補一段', placeholder: '深夜獨處時的留白回望...' }
    ];

    // 生活流動 10 項
    const LIFE_ITEMS = [
      { id: 'l_wake', label: '今天起床的身體感覺', placeholder: '睡眠品質、四肢的重量、清醒時第一道光影...' },
      { id: 'l_space', label: '今日身處最具呼吸感的空間', placeholder: '家裡的某個角落、城市裡的長椅、騎車吹風的街口...' },
      { id: 'l_diet', label: '今天的咖啡 / 食味記憶', placeholder: '一杯手沖的風味、餐桌上的滋味、味蕾的停頓點...' },
      { id: 'l_sensory', label: '一個純粹的生活感官細節', placeholder: '衣服的棉麻觸感、洗澡時的蒸氣、路上聞到的木質氣味...' },
      { id: 'l_aesthetic', label: '今天看見的一處好光影或好物件', placeholder: '器皿線條、牆面斜陽、某個材質的天然紋理...' },
      { id: 'l_movement', label: '今天的步調與身體活動', placeholder: '散步、騎行、舒展筋骨、或者純粹安靜地坐著...' },
      { id: 'l_dialogue', label: '一句無關工作的日常對話', placeholder: '與店員、家人、朋友、或者自己心裡的閒談...' },
      { id: 'l_consume', label: '今天吸收的一段文字 / 音樂 / 影像', placeholder: '翻到的書頁、循環播放的單曲、一個安靜鏡頭...' },
      { id: 'l_mind', label: '今天為自己保留的一段空白', placeholder: '完全放下手機與外界回饋的放空片刻...' },
      { id: 'l_closing', label: '入睡前想對今天說的一句話', placeholder: '卸下所有身分後的告解或平靜收尾...' }
    ];

    let currentTab = 'work'; // 'work' | 'life'
    let state = {
      work: {},
      life: {},
      tasks: []
    };

    WORK_ITEMS.forEach(i => { state.work[i.id] = { checked: false, note: '' }; });
    LIFE_ITEMS.forEach(i => { state.life[i.id] = { checked: false, note: '' }; });

    const STORAGE_KEY = 'ERIC_LOG_DUAL_DATA';

    function loadSavedData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed.work) state.work = { ...state.work, ...parsed.work };
          if (parsed.life) state.life = { ...state.life, ...parsed.life };
          if (parsed.tasks) state.tasks = parsed.tasks;
        } catch (e) {}
      }
    }

    function persistData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function renderDate() {
      const now = new Date();
      const yr = now.getFullYear();
      const mo = String(now.getMonth() + 1).padStart(2, '0');
      const da = String(now.getDate()).padStart(2, '0');
      const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
      document.getElementById('currentDateDisplay').textContent = `${yr}.${mo}.${da} [${days[now.getDay()]}]`;
    }

    function updateProgress() {
      const activeList = currentTab === 'work' ? WORK_ITEMS : LIFE_ITEMS;
      const activeData = currentTab === 'work' ? state.work : state.life;
      const total = activeList.length;
      const checked = Object.values(activeData).filter(item => item.checked).length;
      const pct = Math.round((checked / total) * 100);

      document.getElementById('tabBadge').textContent = currentTab.toUpperCase();
      document.getElementById('progressPercent').textContent = `${pct}%`;
      document.getElementById('checkedCount').textContent = `${checked} / ${total} COMPLETED`;
    }

    function renderCheckpoints() {
      const container = document.getElementById('checkpointsContainer');
      container.innerHTML = '';
      
      const activeList = currentTab === 'work' ? WORK_ITEMS : LIFE_ITEMS;
      const activeData = currentTab === 'work' ? state.work : state.life;

      document.getElementById('sectionTitle').textContent = currentTab === 'work' 
        ? '01 / Work Observer Checkpoints' 
        : '01 / Life Rhythm Checkpoints';

      activeList.forEach((item, index) => {
        const data = activeData[item.id] || { checked: false, note: '' };
        const wrapper = document.createElement('div');
        wrapper.className = `border rounded-lg p-3 transition-colors ${
          data.checked ? 'bg-neutral-900/60 border-neutral-800' : 'bg-neutral-950 border-neutral-850'
        }`;

        wrapper.innerHTML = `
          <div class="flex items-start gap-3">
            <button 
              type="button" 
              class="toggle-check mt-0.5 w-4 h-4 rounded border flex items-center justify-center transition-all ${
                data.checked ? 'bg-neutral-200 border-neutral-200 text-neutral-950' : 'border-neutral-700 bg-neutral-900 hover:border-neutral-500'
              }"
              data-id="${item.id}"
            >
              ${data.checked ? '<svg class="w-3 h-3 fill-current" viewBox="0 0 20 20"><path d="M0 11l2-2 5 5L18 3l2 2L7 18z"/></svg>' : ''}
            </button>
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-center mb-1.5">
                <span class="text-xs font-medium tracking-wide ${data.checked ? 'text-neutral-400 line-through' : 'text-neutral-200'}">
                  ${item.label}
                </span>
                <span class="text-[10px] font-mono text-neutral-600">0${index + 1}</span>
              </div>
              <textarea 
                data-id="${item.id}"
                placeholder="${item.placeholder}" 
                rows="${item.id === 'w_details' ? '3' : '2'}"
                class="note-input w-full bg-neutral-900/50 border border-neutral-800/80 rounded px-2.5 py-1.5 text-xs text-neutral-300 placeholder-neutral-650 resize-y focus:border-neutral-600 focus:bg-neutral-900 transition-colors"
              >${data.note || ''}</textarea>
            </div>
          </div>
        `;
        container.appendChild(wrapper);
      });

      container.querySelectorAll('.toggle-check').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = e.currentTarget.dataset.id;
          activeData[id].checked = !activeData[id].checked;
          persistData();
          renderCheckpoints();
          updateProgress();
        });
      });

      container.querySelectorAll('.note-input').forEach(ta => {
        ta.addEventListener('input', (e) => {
          const id = e.currentTarget.dataset.id;
          activeData[id].note = e.target.value;
          persistData();
        });
      });
    }

    function renderTasks() {
      const container = document.getElementById('taskList');
      container.innerHTML = '';
      const pendingCount = state.tasks.filter(t => !t.done).length;
      document.getElementById('activeTaskCount').textContent = `${pendingCount} 待辦`;

      if (state.tasks.length === 0) {
        container.innerHTML = `<div class="text-xs text-neutral-600 italic py-4 text-center">尚無速記備忘</div>`;
        return;
      }

      state.tasks.forEach((t, i) => {
        const el = document.createElement('div');
        el.className = 'group flex items-center justify-between gap-2 p-2 rounded bg-neutral-950 border border-neutral-850 text-xs';
        el.innerHTML = `
          <div class="flex items-center gap-2.5 min-w-0">
            <input 
              type="checkbox" 
              ${t.done ? 'checked' : ''} 
              class="task-toggle rounded bg-neutral-900 border-neutral-700 text-neutral-200 accent-neutral-300 w-3.5 h-3.5 cursor-pointer"
              data-index="${i}"
            />
            <span class="truncate ${t.done ? 'text-neutral-600 line-through' : 'text-neutral-300'}">${t.text}</span>
          </div>
          <button class="delete-task text-[11px] font-mono text-neutral-600 hover:text-neutral-400 px-1 opacity-0 group-hover:opacity-100 transition-opacity" data-index="${i}">
            ✕
          </button>
        `;
        container.appendChild(el);
      });

      container.querySelectorAll('.task-toggle').forEach(chk => {
        chk.addEventListener('change', (e) => {
          const idx = parseInt(e.target.dataset.index, 10);
          state.tasks[idx].done = e.target.checked;
          persistData();
          renderTasks();
        });
      });

      container.querySelectorAll('.delete-task').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const idx = parseInt(e.currentTarget.dataset.index, 10);
          state.tasks.splice(idx, 1);
          persistData();
          renderTasks();
        });
      });
    }

    function initTabs() {
      const tabWork = document.getElementById('btnTabWork');
      const tabLife = document.getElementById('btnTabLife');

      tabWork.addEventListener('click', () => {
        if (currentTab === 'work') return;
        currentTab = 'work';
        tabWork.className = 'pb-3 px-4 border-b-2 border-neutral-200 text-neutral-100 transition-colors flex items-center gap-2';
        tabLife.className = 'pb-3 px-4 border-b-2 border-transparent text-neutral-500 hover:text-neutral-300 transition-colors flex items-center gap-2';
        renderCheckpoints();
        updateProgress();
      });

      tabLife.addEventListener('click', () => {
        if (currentTab === 'life') return;
        currentTab = 'life';
        tabLife.className = 'pb-3 px-4 border-b-2 border-neutral-200 text-neutral-100 transition-colors flex items-center gap-2';
        tabWork.className = 'pb-3 px-4 border-b-2 border-transparent text-neutral-500 hover:text-neutral-300 transition-colors flex items-center gap-2';
        renderCheckpoints();
        updateProgress();
      });
    }

    function initTaskInput() {
      const input = document.getElementById('newTaskInput');
      const addBtn = document.getElementById('addTaskBtn');
      const handleAdd = () => {
        const val = input.value.trim();
        if (!val) return;
        state.tasks.unshift({ text: val, done: false, created: Date.now() });
        input.value = '';
        persistData();
        renderTasks();
      };
      addBtn.addEventListener('click', handleAdd);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleAdd(); });
    }

    function initMarkdownExport() {
      const btn = document.getElementById('copyMarkdownBtn');
      btn.addEventListener('click', () => {
        const now = new Date();
        const dateStr = now.toISOString().slice(0, 10);
        let md = `# ERIC.LOG - ${dateStr}\n\n`;

        md += `## 01 / WORK OBSERVER (工作觀察誌)\n`;
        WORK_ITEMS.forEach(item => {
          const c = state.work[item.id] || {};
          md += `- ${c.checked ? '[x]' : '[ ]'} **${item.label}**\n`;
          if (c.note && c.note.trim()) {
            md += c.note.split('\n').map(l => `  > ${l}`).join('\n') + '\n';
          }
        });

        md += `\n## 02 / LIFE RHYTHM (生活流動誌)\n`;
        LIFE_ITEMS.forEach(item => {
          const c = state.life[item.id] || {};
          md += `- ${c.checked ? '[x]' : '[ ]'} **${item.label}**\n`;
          if (c.note && c.note.trim()) {
            md += c.note.split('\n').map(l => `  > ${l}`).join('\n') + '\n';
          }
        });

        if (state.tasks.length > 0) {
          md += `\n## 03 / QUICK TASKS & NOTES (即時速記)\n`;
          state.tasks.forEach(t => {
            md += `- ${t.done ? '[x]' : '[ ]'} ${t.text}\n`;
          });
        }

        navigator.clipboard.writeText(md).then(() => {
          const orig = btn.innerHTML;
          btn.innerHTML = `<span class="text-neutral-400">✓ 已完整複製兩側日誌</span>`;
          setTimeout(() => { btn.innerHTML = orig; }, 2000);
        });
      });
    }

    function initReset() {
      document.getElementById('resetDayBtn').addEventListener('click', () => {
        const tabName = currentTab === 'work' ? '工作觀察誌' : '生活流動誌';
        if (confirm(`確定清空當前「${tabName}」的所有勾選與輸入嗎？`)) {
          const target = currentTab === 'work' ? state.work : state.life;
          const list = currentTab === 'work' ? WORK_ITEMS : LIFE_ITEMS;
          list.forEach(i => { target[i.id] = { checked: false, note: '' }; });
          persistData();
          renderCheckpoints();
          updateProgress();
        }
      });
    }

    loadSavedData();
    renderDate();
    initTabs();
    renderCheckpoints();
    renderTasks();
    updateProgress();
    initTaskInput();
    initMarkdownExport();
    initReset();
  </script>
</body>
</html>
