<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ERIC.LOG</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0c0c0d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ERIC.LOG">
  <link rel="apple-touch-icon" href="icon.svg">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Noto Sans TC"', 'sans-serif'],
            mono: ['SF Pro Text', 'ui-monospace', 'Menlo', 'monospace']
          },
          colors: {
            neutral: {
              950: '#0c0c0d',
              900: '#141416',
              850: '#1a1a1d',
              800: '#222226',
              700: '#323238',
              650: '#484852',
              400: '#8e8e98',
              300: '#b4b4bd',
              200: '#dedee3'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      padding-top: max(1.5rem, env(safe-area-inset-top));
      padding-bottom: max(2rem, env(safe-area-inset-bottom));
      padding-left: max(1.2rem, env(safe-area-inset-left));
      padding-right: max(1.2rem, env(safe-area-inset-right));
      -webkit-touch-callout: none;
    }
    input:focus { outline: none; }
    .custom-scroll::-webkit-scrollbar { width: 3px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #26262b; border-radius: 2px; }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-200 min-h-screen font-sans antialiased flex justify-center selection:bg-neutral-800">

  <div class="w-full max-w-5xl flex flex-col gap-6">
    
    <!-- Top Header -->
    <header class="border-b border-neutral-850 pb-4 flex flex-wrap justify-between items-baseline gap-3">
      <div>
        <div class="text-[10px] font-mono tracking-[0.25em] text-neutral-400 uppercase">Daily Task Notebook</div>
        <h1 class="text-xl font-light tracking-wide text-neutral-100 mt-0.5 font-mono">ERIC.LOG</h1>
      </div>
      <div class="flex items-center gap-4">
        <div class="text-xs font-mono text-neutral-400" id="currentDateDisplay">----.--.--</div>
        <div class="text-xs font-mono px-2 py-0.5 bg-neutral-900 border border-neutral-800 rounded text-neutral-300">
          <span id="totalPendingCount">0</span> 待辦
        </div>
      </div>
    </header>

    <!-- 3 Columns: 工作 / 生活 / 自己 -->
    <main class="grid grid-cols-1 md:grid-cols-3 gap-5 items-start">
      
      <!-- 01 工作 (WORK) -->
      <section class="bg-neutral-900/60 border border-neutral-850 rounded-xl p-4 flex flex-col gap-3">
        <div class="flex items-center justify-between pb-2 border-b border-neutral-850">
          <div class="flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full bg-neutral-300"></span>
            <h2 class="text-xs font-mono font-medium tracking-wider text-neutral-200 uppercase">工作 / WORK</h2>
          </div>
          <span class="text-[11px] font-mono text-neutral-500" id="count-work">0</span>
        </div>

        <div class="flex gap-1.5">
          <input 
            type="text" 
            id="input-work" 
            placeholder="新增工作事項..." 
            class="w-full bg-neutral-950 border border-neutral-800 rounded px-2.5 py-1.5 text-xs text-neutral-200 placeholder-neutral-650 focus:border-neutral-500 transition-colors"
          />
          <button 
            onclick="addItem('work')"
            class="px-2.5 py-1.5 bg-neutral-800 hover:bg-neutral-700 active:bg-neutral-600 text-neutral-200 text-xs font-mono rounded transition-colors"
          >+</button>
        </div>

        <div id="list-work" class="flex flex-col gap-1.5 min-h-[140px] max-h-[520px] overflow-y-auto custom-scroll pr-0.5"></div>
      </section>

      <!-- 02 生活 (LIFE) -->
      <section class="bg-neutral-900/60 border border-neutral-850 rounded-xl p-4 flex flex-col gap-3">
        <div class="flex items-center justify-between pb-2 border-b border-neutral-850">
          <div class="flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full bg-neutral-400"></span>
            <h2 class="text-xs font-mono font-medium tracking-wider text-neutral-200 uppercase">生活 / LIFE</h2>
          </div>
          <span class="text-[11px] font-mono text-neutral-500" id="count-life">0</span>
        </div>

        <div class="flex gap-1.5">
          <input 
            type="text" 
            id="input-life" 
            placeholder="新增生活雜務、採買..." 
            class="w-full bg-neutral-950 border border-neutral-800 rounded px-2.5 py-1.5 text-xs text-neutral-200 placeholder-neutral-650 focus:border-neutral-500 transition-colors"
          />
          <button 
            onclick="addItem('life')"
            class="px-2.5 py-1.5 bg-neutral-800 hover:bg-neutral-700 active:bg-neutral-600 text-neutral-200 text-xs font-mono rounded transition-colors"
          >+</button>
        </div>

        <div id="list-life" class="flex flex-col gap-1.5 min-h-[140px] max-h-[520px] overflow-y-auto custom-scroll pr-0.5"></div>
      </section>

      <!-- 03 自己 (SELF) -->
      <section class="bg-neutral-900/60 border border-neutral-850 rounded-xl p-4 flex flex-col gap-3">
        <div class="flex items-center justify-between pb-2 border-b border-neutral-850">
          <div class="flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full bg-neutral-500"></span>
            <h2 class="text-xs font-mono font-medium tracking-wider text-neutral-200 uppercase">自己 / SELF</h2>
          </div>
          <span class="text-[11px] font-mono text-neutral-500" id="count-self">0</span>
        </div>

        <div class="flex gap-1.5">
          <input 
            type="text" 
            id="input-self" 
            placeholder="閱讀、品飲、空白、私密思考..." 
            class="w-full bg-neutral-950 border border-neutral-800 rounded px-2.5 py-1.5 text-xs text-neutral-200 placeholder-neutral-650 focus:border-neutral-500 transition-colors"
          />
          <button 
            onclick="addItem('self')"
            class="px-2.5 py-1.5 bg-neutral-800 hover:bg-neutral-700 active:bg-neutral-600 text-neutral-200 text-xs font-mono rounded transition-colors"
          >+</button>
        </div>

        <div id="list-self" class="flex flex-col gap-1.5 min-h-[140px] max-h-[520px] overflow-y-auto custom-scroll pr-0.5"></div>
      </section>

    </main>

    <!-- Bottom Actions -->
    <footer class="mt-2 pt-4 border-t border-neutral-850 flex flex-wrap items-center justify-between gap-3">
      <div class="flex gap-2">
        <button 
          id="copyBtn" 
          class="px-3.5 py-1.5 bg-neutral-900 hover:bg-neutral-850 active:bg-neutral-800 border border-neutral-700 text-xs font-mono text-neutral-200 rounded transition-all"
        >
          複製清單 (MARKDOWN)
        </button>
        <button 
          id="clearCompletedBtn" 
          class="px-3 py-1.5 bg-transparent hover:bg-neutral-900 border border-neutral-800 text-xs font-mono text-neutral-400 hover:text-neutral-200 rounded transition-all"
        >
          清除已完成項目
        </button>
      </div>

      <button 
        id="resetAllBtn" 
        class="text-[11px] font-mono text-neutral-600 hover:text-red-400 transition-colors"
      >
        清空全部項目
      </button>
    </footer>

  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }

    const STORAGE_KEY = 'ERIC_LOG_SIMPLE_TASKS';
    const CATEGORIES = ['work', 'life', 'self'];
    const CAT_LABELS = { work: '工作', life: '生活', self: '自己' };

    let state = {
      work: [],
      life: [],
      self: []
    };

    function loadSavedData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          CATEGORIES.forEach(c => {
            if (Array.isArray(parsed[c])) state[c] = parsed[c];
          });
        } catch (e) {}
      }
    }

    function persistData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function renderDate() {
      const now = new Date();
      const yr = now.getFullYear();
      const mo = String(now.getMonth() + 1).padStart(2, '0');
      const da = String(now.getDate()).padStart(2, '0');
      const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
      document.getElementById('currentDateDisplay').textContent = `${yr}.${mo}.${da} [${days[now.getDay()]}]`;
    }

    function updateCounts() {
      let totalPending = 0;
      CATEGORIES.forEach(cat => {
        const pending = state[cat].filter(t => !t.done).length;
        totalPending += pending;
        document.getElementById(`count-${cat}`).textContent = `${pending} 待辦`;
      });
      document.getElementById('totalPendingCount').textContent = totalPending;
    }

    function renderList(cat) {
      const container = document.getElementById(`list-${cat}`);
      container.innerHTML = '';

      if (state[cat].length === 0) {
        container.innerHTML = `<div class="text-[11px] text-neutral-650 italic py-6 text-center">暫無待辦</div>`;
        return;
      }

      state[cat].forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'group flex items-start justify-between gap-2 p-2 rounded bg-neutral-950/70 border border-neutral-850 hover:border-neutral-750 transition-all text-xs';
        div.innerHTML = `
          <div class="flex items-start gap-2.5 min-w-0 flex-1 pt-0.5">
            <input 
              type="checkbox" 
              ${item.done ? 'checked' : ''} 
              class="task-toggle mt-0.5 rounded bg-neutral-900 border-neutral-700 text-neutral-200 accent-neutral-300 w-3.5 h-3.5 cursor-pointer flex-shrink-0"
              data-cat="${cat}" 
              data-index="${index}"
            />
            <span class="break-words leading-relaxed ${item.done ? 'text-neutral-600 line-through' : 'text-neutral-200'}">${item.text}</span>
          </div>
          <button 
            class="delete-btn text-[11px] font-mono text-neutral-650 hover:text-neutral-300 px-1 opacity-0 group-hover:opacity-100 transition-opacity" 
            data-cat="${cat}" 
            data-index="${index}"
          >✕</button>
        `;
        container.appendChild(div);
      });

      container.querySelectorAll('.task-toggle').forEach(chk => {
        chk.addEventListener('change', (e) => {
          const c = e.target.dataset.cat;
          const idx = parseInt(e.target.dataset.index, 10);
          state[c][idx].done = e.target.checked;
          persistData();
          renderList(c);
          updateCounts();
        });
      });

      container.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const c = e.currentTarget.dataset.cat;
          const idx = parseInt(e.currentTarget.dataset.index, 10);
          state[c].splice(idx, 1);
          persistData();
          renderList(c);
          updateCounts();
        });
      });
    }

    function renderAllLists() {
      CATEGORIES.forEach(c => renderList(c));
      updateCounts();
    }

    function addItem(cat) {
      const input = document.getElementById(`input-${cat}`);
      const val = input.value.trim();
      if (!val) return;
      state[cat].unshift({ text: val, done: false, created: Date.now() });
      input.value = '';
      persistData();
      renderList(cat);
      updateCounts();
    }

    function initInputs() {
      CATEGORIES.forEach(cat => {
        const input = document.getElementById(`input-${cat}`);
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') addItem(cat);
        });
      });
    }

    function initActions() {
      const copyBtn = document.getElementById('copyBtn');
      copyBtn.addEventListener('click', () => {
        const now = new Date();
        const dateStr = now.toISOString().slice(0, 10);
        let md = `# ERIC.LOG - ${dateStr}\n\n`;

        CATEGORIES.forEach(cat => {
          md += `### ${CAT_LABELS[cat]}\n`;
          if (state[cat].length === 0) {
            md += `_(無待辦)_\n`;
          } else {
            state[cat].forEach(t => {
              md += `- ${t.done ? '[x]' : '[ ]'} ${t.text}\n`;
            });
          }
          md += `\n`;
        });

        navigator.clipboard.writeText(md).then(() => {
          const orig = copyBtn.textContent;
          copyBtn.textContent = '✓ 已複製剪貼簿';
          setTimeout(() => { copyBtn.textContent = orig; }, 2000);
        });
      });

      document.getElementById('clearCompletedBtn').addEventListener('click', () => {
        CATEGORIES.forEach(cat => {
          state[cat] = state[cat].filter(t => !t.done);
        });
        persistData();
        renderAllLists();
      });

      document.getElementById('resetAllBtn').addEventListener('click', () => {
        if (confirm('確定清空所有分類中的全部事項嗎？')) {
          CATEGORIES.forEach(cat => { state[cat] = []; });
          persistData();
          renderAllLists();
        }
      });
    }

    // Initialize
    loadSavedData();
    renderDate();
    renderAllLists();
    initInputs();
    initActions();
  </script>
</body>
</html>
