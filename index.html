<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ERIC.LOG DAILY</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0c0c0d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ERIC.LOG">
  <link rel="apple-touch-icon" href="icon.svg">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Noto Sans TC"', 'sans-serif'],
            mono: ['SF Pro Text', 'ui-monospace', 'Menlo', 'monospace']
          },
          colors: {
            neutral: {
              950: '#0c0c0d',
              900: '#141416',
              850: '#1a1a1d',
              800: '#222226',
              750: '#2a2a30',
              700: '#323238',
              650: '#484852',
              400: '#8e8e98',
              300: '#b4b4bd',
              200: '#dedee3'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      padding-top: max(1.5rem, env(safe-area-inset-top));
      padding-bottom: max(2rem, env(safe-area-inset-bottom));
      padding-left: max(1.2rem, env(safe-area-inset-left));
      padding-right: max(1.2rem, env(safe-area-inset-right));
      -webkit-touch-callout: none;
    }
    textarea:focus, input:focus { outline: none; }
    .custom-scroll::-webkit-scrollbar { width: 3px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #26262b; border-radius: 2px; }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-200 min-h-screen font-sans antialiased flex justify-center selection:bg-neutral-800">

  <div class="w-full max-w-6xl flex flex-col gap-6 md:gap-8">
    
    <!-- Top Header -->
    <header class="border-b border-neutral-850 pb-4 flex flex-wrap justify-between items-baseline gap-4">
      <div>
        <div class="text-[10px] font-mono tracking-[0.25em] text-neutral-400 uppercase">Observer Journal & Notebook</div>
        <h1 class="text-2xl font-light tracking-wide text-neutral-100 mt-1 font-mono">ERIC.LOG DAILY</h1>
      </div>
      <div class="flex items-center gap-4 md:gap-6">
        <div class="text-xs font-mono text-neutral-400" id="currentDateDisplay">----.--.--</div>
        <div class="text-xs font-mono px-2.5 py-1 bg-neutral-900 border border-neutral-800 rounded">
          DAILY: <span id="progressPercent" class="text-neutral-100 font-semibold">0%</span>
        </div>
      </div>
    </header>

    <!-- Main Two-Column Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      
      <!-- Left Column: 10 Core Daily Checkpoints (7 Cols) -->
      <section class="lg:col-span-7 flex flex-col gap-4">
        <div class="flex items-center justify-between text-xs font-mono text-neutral-400 tracking-wider uppercase mb-1">
          <span>01 / ERIC.LOG DAILY 每日事項</span>
          <span id="checkedCount">0 / 10 COMPLETED</span>
        </div>

        <div id="checkpointsContainer" class="flex flex-col gap-2.5">
          <!-- Dynamic Items Injected by JS -->
        </div>
      </section>

      <!-- Right Column: 3 Categorized Task Notebooks (5 Cols) -->
      <section class="lg:col-span-5 flex flex-col gap-5">
        <div class="text-xs font-mono text-neutral-400 tracking-wider uppercase mb-1">
          <span>02 / 待辦事項速記 (工作・生活・自己)</span>
        </div>

        <!-- 01 工作 / WORK -->
        <div class="bg-neutral-900/60 border border-neutral-850 rounded-xl p-3.5 flex flex-col gap-2.5">
          <div class="flex items-center justify-between pb-1.5 border-b border-neutral-850">
            <div class="flex items-center gap-2">
              <span class="w-1.5 h-1.5 rounded-full bg-neutral-300"></span>
              <span class="text-xs font-mono text-neutral-200 uppercase tracking-wider">工作 / WORK</span>
            </div>
            <span class="text-[11px] font-mono text-neutral-500" id="count-work">0 待辦</span>
          </div>
          <div class="flex gap-1.5">
            <input 
              type="text" 
              id="input-work" 
              placeholder="新增工作待辦..." 
              class="w-full bg-neutral-950 border border-neutral-800 rounded px-2.5 py-1.5 text-xs text-neutral-200 placeholder-neutral-650 focus:border-neutral-500 transition-colors"
            />
            <button onclick="addTask('work')" class="px-2.5 py-1.5 bg-neutral-800 hover:bg-neutral-700 active:bg-neutral-600 text-neutral-200 text-xs font-mono rounded">+</button>
          </div>
          <div id="list-work" class="flex flex-col gap-1 max-h-[160px] overflow-y-auto custom-scroll pr-0.5"></div>
        </div>

        <!-- 02 生活 / LIFE -->
        <div class="bg-neutral-900/60 border border-neutral-850 rounded-xl p-3.5 flex flex-col gap-2.5">
          <div class="flex items-center justify-between pb-1.5 border-b border-neutral-850">
            <div class="flex items-center gap-2">
              <span class="w-1.5 h-1.5 rounded-full bg-neutral-400"></span>
              <span class="text-xs font-mono text-neutral-200 uppercase tracking-wider">生活 / LIFE</span>
            </div>
            <span class="text-[11px] font-mono text-neutral-500" id="count-life">0 待辦</span>
          </div>
          <div class="flex gap-1.5">
            <input 
              type="text" 
              id="input-life" 
              placeholder="採買、帳單、生活雜務..." 
              class="w-full bg-neutral-950 border border-neutral-800 rounded px-2.5 py-1.5 text-xs text-neutral-200 placeholder-neutral-650 focus:border-neutral-500 transition-colors"
            />
            <button onclick="addTask('life')" class="px-2.5 py-1.5 bg-neutral-800 hover:bg-neutral-700 active:bg-neutral-600 text-neutral-200 text-xs font-mono rounded">+</button>
          </div>
          <div id="list-life" class="flex flex-col gap-1 max-h-[160px] overflow-y-auto custom-scroll pr-0.5"></div>
        </div>

        <!-- 03 自己 / SELF -->
        <div class="bg-neutral-900/60 border border-neutral-850 rounded-xl p-3.5 flex flex-col gap-2.5">
          <div class="flex items-center justify-between pb-1.5 border-b border-neutral-850">
            <div class="flex items-center gap-2">
              <span class="w-1.5 h-1.5 rounded-full bg-neutral-500"></span>
              <span class="text-xs font-mono text-neutral-200 uppercase tracking-wider">自己 / SELF</span>
            </div>
            <span class="text-[11px] font-mono text-neutral-500" id="count-self">0 待辦</span>
          </div>
          <div class="flex gap-1.5">
            <input 
              type="text" 
              id="input-self" 
              placeholder="閱讀、品飲、空白、私密思考..." 
              class="w-full bg-neutral-950 border border-neutral-800 rounded px-2.5 py-1.5 text-xs text-neutral-200 placeholder-neutral-650 focus:border-neutral-500 transition-colors"
            />
            <button onclick="addTask('self')" class="px-2.5 py-1.5 bg-neutral-800 hover:bg-neutral-700 active:bg-neutral-600 text-neutral-200 text-xs font-mono rounded">+</button>
          </div>
          <div id="list-self" class="flex flex-col gap-1 max-h-[160px] overflow-y-auto custom-scroll pr-0.5"></div>
        </div>

        <!-- Actions -->
        <div class="flex flex-col gap-2 pt-2">
          <button 
            id="copyMarkdownBtn" 
            class="w-full py-2.5 bg-neutral-900 hover:bg-neutral-850 active:bg-neutral-800 border border-neutral-700 text-xs font-mono tracking-wider text-neutral-200 rounded transition-all flex items-center justify-center gap-2"
          >
            <span>複製今日記錄與待辦 (MARKDOWN)</span>
          </button>
          <button 
            id="resetDayBtn" 
            class="w-full py-2 text-[11px] font-mono text-neutral-500 hover:text-red-400 transition-colors text-center"
          >
            清空每日觀察勾選與紀錄
          </button>
        </div>

      </section>

    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }

    // 原始 10 個核心事項
    const CORE_ITEMS = [
      { id: 'start_state', label: '今天開始前的我', placeholder: '早晨的身心狀態、出門時的微小念頭...' },
      { id: 'location', label: '今天在哪裡', placeholder: '辦公室、基地現場、某個咖啡角、高鐵途中...' },
      { id: 'doing', label: '今天在做什麼', placeholder: '今日的核心事件或推動的企劃焦點...' },
      { id: 'work_details', label: '3 個工作細節', placeholder: '1. \n2. \n3. ' },
      { id: 'working_scene', label: '一個「我本人在工作」的畫面', placeholder: '如第三人視角抽離看到的定格光景...' },
      { id: 'ambient_sound', label: '一個環境聲', placeholder: '鍵盤敲擊、空調低頻、某段對話殘響、雨聲...' },
      { id: 'first_reaction', label: '事情結束後的第一反應', placeholder: '收拾電腦闔上螢幕那一刻真實浮現的情緒...' },
      { id: 'quote', label: '今天有沒有一句值得留下的話', placeholder: '會議上的字句、聽到的話、或心裡的旁白...' },
      { id: 'countdown_feeling', label: '今天有沒有「離職倒數」的感覺', placeholder: '敏銳觀察邊界感、抽離感或純粹專注...' },
      { id: 'night_log', label: '晚上要不要補一段', placeholder: '深夜獨處時的留白回望...' }
    ];

    const CATS = ['work', 'life', 'self'];
    const CAT_NAMES = { work: '工作', life: '生活', self: '自己' };

    let state = {
      core: {},
      tasks: { work: [], life: [], self: [] }
    };

    CORE_ITEMS.forEach(item => {
      state.core[item.id] = { checked: false, note: '' };
    });

    const STORAGE_KEY = 'ERIC_LOG_UNIFIED_STORAGE';

    function loadSavedData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed.core) state.core = { ...state.core, ...parsed.core };
          if (parsed.tasks) {
            CATS.forEach(c => {
              if (Array.isArray(parsed.tasks[c])) state.tasks[c] = parsed.tasks[c];
            });
          }
        } catch (e) {}
      }
    }

    function persistData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function renderDate() {
      const now = new Date();
      const yr = now.getFullYear();
      const mo = String(now.getMonth() + 1).padStart(2, '0');
      const da = String(now.getDate()).padStart(2, '0');
      const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
      document.getElementById('currentDateDisplay').textContent = `${yr}.${mo}.${da} [${days[now.getDay()]}]`;
    }

    function updateProgress() {
      const total = CORE_ITEMS.length;
      const checked = Object.values(state.core).filter(item => item.checked).length;
      const pct = Math.round((checked / total) * 100);

      document.getElementById('progressPercent').textContent = `${pct}%`;
      document.getElementById('checkedCount').textContent = `${checked} / ${total} COMPLETED`;
    }

    function renderCoreItems() {
      const container = document.getElementById('checkpointsContainer');
      container.innerHTML = '';

      CORE_ITEMS.forEach((item, index) => {
        const data = state.core[item.id] || { checked: false, note: '' };
        const wrapper = document.createElement('div');
        wrapper.className = `border rounded-lg p-3 transition-colors ${
          data.checked ? 'bg-neutral-900/60 border-neutral-800' : 'bg-neutral-950 border-neutral-850'
        }`;

        wrapper.innerHTML = `
          <div class="flex items-start gap-3">
            <button 
              type="button" 
              class="toggle-check mt-0.5 w-4 h-4 rounded border flex items-center justify-center transition-all ${
                data.checked ? 'bg-neutral-200 border-neutral-200 text-neutral-950' : 'border-neutral-700 bg-neutral-900 hover:border-neutral-500'
              }"
              data-id="${item.id}"
            >
              ${data.checked ? '<svg class="w-3 h-3 fill-current" viewBox="0 0 20 20"><path d="M0 11l2-2 5 5L18 3l2 2L7 18z"/></svg>' : ''}
            </button>
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-center mb-1.5">
                <span class="text-xs font-medium tracking-wide ${data.checked ? 'text-neutral-400 line-through' : 'text-neutral-200'}">
                  ${item.label}
                </span>
                <span class="text-[10px] font-mono text-neutral-600">0${index + 1}</span>
              </div>
              <textarea 
                data-id="${item.id}"
                placeholder="${item.placeholder}" 
                rows="${item.id === 'work_details' ? '3' : '2'}"
                class="note-input w-full bg-neutral-900/50 border border-neutral-800/80 rounded px-2.5 py-1.5 text-xs text-neutral-300 placeholder-neutral-650 resize-y focus:border-neutral-600 focus:bg-neutral-900 transition-colors"
              >${data.note || ''}</textarea>
            </div>
          </div>
        `;
        container.appendChild(wrapper);
      });

      container.querySelectorAll('.toggle-check').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = e.currentTarget.dataset.id;
          state.core[id].checked = !state.core[id].checked;
          persistData();
          renderCoreItems();
          updateProgress();
        });
      });

      container.querySelectorAll('.note-input').forEach(ta => {
        ta.addEventListener('input', (e) => {
          const id = e.currentTarget.dataset.id;
          state.core[id].note = e.target.value;
          persistData();
        });
      });
    }

    function renderTaskList(cat) {
      const container = document.getElementById(`list-${cat}`);
      container.innerHTML = '';
      const list = state.tasks[cat] || [];
      const pending = list.filter(t => !t.done).length;
      document.getElementById(`count-${cat}`).textContent = `${pending} 待辦`;

      if (list.length === 0) {
        container.innerHTML = `<div class="text-[11px] text-neutral-650 italic py-2 text-center">暫無待辦</div>`;
        return;
      }

      list.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'group flex items-start justify-between gap-2 p-1.5 rounded bg-neutral-950/70 border border-neutral-850 hover:border-neutral-750 transition-all text-xs';
        div.innerHTML = `
          <div class="flex items-start gap-2 min-w-0 flex-1 pt-0.5">
            <input 
              type="checkbox" 
              ${item.done ? 'checked' : ''} 
              class="task-chk mt-0.5 rounded bg-neutral-900 border-neutral-700 text-neutral-200 accent-neutral-300 w-3.5 h-3.5 cursor-pointer flex-shrink-0"
              data-cat="${cat}" 
              data-index="${index}"
            />
            <span class="break-words leading-relaxed ${item.done ? 'text-neutral-600 line-through' : 'text-neutral-200'}">${item.text}</span>
          </div>
          <button 
            class="del-btn text-[11px] font-mono text-neutral-650 hover:text-neutral-300 px-1 opacity-0 group-hover:opacity-100 transition-opacity" 
            data-cat="${cat}" 
            data-index="${index}"
          >✕</button>
        `;
        container.appendChild(div);
      });

      container.querySelectorAll('.task-chk').forEach(chk => {
        chk.addEventListener('change', (e) => {
          const c = e.target.dataset.cat;
          const idx = parseInt(e.target.dataset.index, 10);
          state.tasks[c][idx].done = e.target.checked;
          persistData();
          renderTaskList(c);
        });
      });

      container.querySelectorAll('.del-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const c = e.currentTarget.dataset.cat;
          const idx = parseInt(e.currentTarget.dataset.index, 10);
          state.tasks[c].splice(idx, 1);
          persistData();
          renderTaskList(c);
        });
      });
    }

    function renderAllTasks() {
      CATS.forEach(c => renderTaskList(c));
    }

    function addTask(cat) {
      const input = document.getElementById(`input-${cat}`);
      const val = input.value.trim();
      if (!val) return;
      if (!state.tasks[cat]) state.tasks[cat] = [];
      state.tasks[cat].unshift({ text: val, done: false, created: Date.now() });
      input.value = '';
      persistData();
      renderTaskList(cat);
    }

    function initTaskInputs() {
      CATS.forEach(cat => {
        const input = document.getElementById(`input-${cat}`);
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') addTask(cat);
        });
      });
    }

    function initMarkdownExport() {
      const btn = document.getElementById('copyMarkdownBtn');
      btn.addEventListener('click', () => {
        const now = new Date();
        const dateStr = now.toISOString().slice(0, 10);
        let md = `# ERIC.LOG DAILY - ${dateStr}\n\n`;

        md += `## 每日事項 (ERIC.LOG DAILY)\n`;
        CORE_ITEMS.forEach(item => {
          const c = state.core[item.id] || {};
          md += `- ${c.checked ? '[x]' : '[ ]'} **${item.label}**\n`;
          if (c.note && c.note.trim()) {
            md += c.note.split('\n').map(l => `  > ${l}`).join('\n') + '\n';
          }
        });

        CATS.forEach(cat => {
          const list = state.tasks[cat] || [];
          if (list.length > 0) {
            md += `\n### 待辦 - ${CAT_NAMES[cat]}\n`;
            list.forEach(t => {
              md += `- ${t.done ? '[x]' : '[ ]'} ${t.text}\n`;
            });
          }
        });

        navigator.clipboard.writeText(md).then(() => {
          const orig = btn.innerHTML;
          btn.innerHTML = `<span class="text-neutral-400">✓ 已完整複製今日記錄</span>`;
          setTimeout(() => { btn.innerHTML = orig; }, 2000);
        });
      });
    }

    function initReset() {
      document.getElementById('resetDayBtn').addEventListener('click', () => {
        if (confirm('確定清空今日「每日事項」的 10 個勾選與文字記錄嗎？（工作/生活/自己待辦不會受影響）')) {
          CORE_ITEMS.forEach(item => {
            state.core[item.id] = { checked: false, note: '' };
          });
          persistData();
          renderCoreItems();
          updateProgress();
        }
      });
    }

    // Run
    loadSavedData();
    renderDate();
    renderCoreItems();
    renderAllTasks();
    updateProgress();
    initTaskInputs();
    initMarkdownExport();
    initReset();
  </script>
</body>
</html>
